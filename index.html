<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Program postură</title>
  <meta name="description" content="Programul de corectare posturală: 30 de zile, cu timer ghidat, clipuri și calendar.">
  <meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Postură">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      const t = JSON.parse(localStorage.getItem('postura.v1') || '{}').settings?.theme;
      if (t && t !== 'auto') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#azi"><img src="icon.svg" alt="" width="30" height="30"><span>Postură</span></a>
      <nav class="nav nav-top" aria-label="Secțiuni">
        <a href="#azi" data-icon="home">Azi</a>
        <a href="#exercitii" data-icon="list">Exerciții</a>
        <a href="#calendar" data-icon="calendar">Calendar</a>
        <a href="#setari" data-icon="sliders">Setări</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <section id="view-azi" class="view"></section>
    <section id="view-exercitii" class="view" hidden></section>
    <section id="view-calendar" class="view" hidden></section>
    <section id="view-setari" class="view" hidden></section>
  </main>

  <nav class="nav nav-bottom" aria-label="Secțiuni">
    <a href="#azi" data-icon="home">Azi</a>
    <a href="#exercitii" data-icon="list">Exerciții</a>
    <a href="#calendar" data-icon="calendar">Calendar</a>
    <a href="#setari" data-icon="sliders">Setări</a>
  </nav>

  <div id="player" class="player" hidden>
    <div class="pl-top">
      <button id="pl-close" class="icon-btn" type="button" aria-label="Oprește antrenamentul" data-icon="close"></button>
      <div class="pl-where"><span id="pl-block" class="pill"></span><span id="pl-count"></span></div>
      <button id="pl-sound" class="icon-btn" type="button" aria-label="Sunet"></button>
    </div>
    <div class="pl-progress"><span id="pl-bar"></span></div>
    <div class="pl-body">
      <div class="pl-ex">
        <h2 id="pl-name"></h2>
        <p id="pl-warn" class="warn" hidden></p>
        <p id="pl-dose" class="pl-dose"></p>
        <p id="pl-meta" class="pl-meta"></p>
        <div id="pl-videos" class="pl-videos"></div>
        <div id="pl-weight" hidden></div>
      </div>
      <div id="pl-dial" class="pl-dial">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle id="pl-ring" class="ring-fill" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="dial-center">
          <p id="pl-phase" class="pl-phase"></p>
          <p id="pl-time" class="pl-time"></p>
          <p id="pl-hint" class="pl-hint"></p>
        </div>
      </div>
      <div class="pl-status">
        <div id="pl-counters" class="pl-counters"></div>
        <div id="pl-seq" class="pl-seq"></div>
        <div id="pl-dots" class="pl-dots"></div>
      </div>
      <div class="pl-actions">
        <button id="pl-act1" type="button" hidden></button>
        <button id="pl-act2" type="button" hidden></button>
      </div>
      <div class="pl-controls">
        <button id="pl-prev" class="ctl" type="button" aria-label="Exercițiul anterior" data-icon="prev"></button>
        <button id="pl-toggle" class="ctl ctl-main" type="button" aria-label="Pauză"></button>
        <button id="pl-next" class="ctl" type="button" aria-label="Exercițiul următor" data-icon="next"></button>
      </div>
      <div class="pl-foot">
        <p id="pl-upnext"></p>
        <p id="pl-remain"></p>
      </div>
    </div>
    <div id="pl-done" class="pl-done" hidden></div>
    <div id="pl-confirm" class="pl-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="pl-confirm-title">
      <div class="confirm-card">
        <h3 id="pl-confirm-title">Oprești antrenamentul?</h3>
        <p>Blocurile terminate rămân bifate în calendar.</p>
        <div class="row">
          <button id="pl-keep" class="btn primary" type="button">Continuă</button>
          <button id="pl-stop" class="btn ghost" type="button">Oprește</button>
        </div>
      </div>
    </div>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
